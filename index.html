<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDS 재고 관리</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
  <style>
    /* ── CSS Variables ── */
    :root {
      --blue: #4f8ef7;
      --purple: #7c5cfc;
      --green: #34d399;
      --red: #f87171;
      --orange: #fb923c;
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #1f2336;
      --surface3: #252840;
      --border: #2a2d3e;
      --text: #e2e8f0;
      --text-muted: #7a859a;
      --text-dim: #3e4459;
      --header-bg: rgba(15,17,23,0.9);
      --shadow: rgba(0,0,0,0.4);
    }
    [data-theme="light"] {
      --bg: #f0f2f7;
      --surface: #ffffff;
      --surface2: #f5f6fa;
      --surface3: #ededf5;
      --border: #dde1ec;
      --text: #1a202c;
      --text-muted: #64748b;
      --text-dim: #bdc5d4;
      --header-bg: rgba(240,242,247,0.9);
      --shadow: rgba(0,0,0,0.08);
    }

    /* ── Reset ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 400;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: 14px;
      transition: background .25s, color .25s;
      line-height: 1.5;
    }
    a { text-decoration: none; }
    button { font-family: 'Pretendard', sans-serif; }
    input, select, textarea { font-family: 'Pretendard', sans-serif; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Header ── */
    .header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      height: 62px;
      background: var(--header-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px;
    }
    .header-left { display: flex; align-items: center; gap: 14px; }
    .nds-logo {
      background: linear-gradient(135deg, var(--blue) 0%, var(--purple) 100%);
      color: #fff;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 1px;
      padding: 5px 12px;
      border-radius: 9px;
    }
    .header-title-wrap { display: flex; flex-direction: column; }
    .header-title { font-weight: 600; font-size: 17px; line-height: 1.2; }
    .header-subtitle { font-weight: 400; font-size: 11px; color: var(--text-muted); letter-spacing: .3px; }
    .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .date-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      padding: 5px 13px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .theme-btn {
      width: 36px; height: 36px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      transition: background .2s;
    }
    .theme-btn:hover { background: var(--surface3); }
    .count-badge {
      background: rgba(79,142,247,.12);
      border: 1px solid rgba(79,142,247,.25);
      color: var(--blue);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .18s;
      white-space: nowrap;
      outline: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue), var(--purple));
      color: #fff;
      box-shadow: 0 2px 12px rgba(79,142,247,.3);
    }
    .btn-primary:hover { opacity: .88; transform: translateY(-1px); }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--surface3); }
    .btn-ghost {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      padding: 4px 8px; border-radius: 6px;
      font-size: 13px; font-weight: 500;
      transition: all .15s;
    }
    .btn-ghost:hover { background: var(--surface2); color: var(--text); }

    /* ── Main ── */
    .main {
      max-width: 1380px;
      margin: 0 auto;
      padding: 86px 24px 40px;
    }

    /* ── Panel ── */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 2px 20px var(--shadow);
      overflow: hidden;
    }
    .panel + .panel { margin-top: 20px; }
    .panel-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }
    .panel-title { font-weight: 600; font-size: 15px; }

    /* ── Table ── */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead th {
      background: var(--surface2);
      padding: 10px 18px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: .6px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .12s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    tbody td { padding: 14px 18px; vertical-align: middle; }

    .col-add {
      background: none; border: none;
      color: var(--text-muted); cursor: pointer;
      font-size: 14px; font-weight: 600;
      padding: 0 5px; margin-left: 4px;
      border-radius: 4px;
      line-height: 1;
      transition: all .15s;
    }
    .col-add:hover { background: var(--surface3); color: var(--text); }

    .product-link {
      color: var(--blue);
      font-weight: 500;
      cursor: pointer;
      transition: color .15s;
    }
    .product-link:hover { color: var(--purple); text-decoration: underline; }

    /* ── Stock Number ── */
    .stock-num {
      font-family: 'Pretendard', sans-serif;
      font-size: 17px;
      font-weight: 500;
      line-height: 1;
    }
    .stock-zero { color: var(--red); }
    .stock-low  { color: var(--orange); }

    /* ── Tags / Badges ── */
    .tag {
      display: inline-flex; align-items: center;
      padding: 3px 10px; border-radius: 20px;
      font-size: 11px; font-weight: 600;
    }
    .tag-blue   { background: rgba(79,142,247,.14);  color: var(--blue); }
    .tag-purple { background: rgba(124,92,252,.14);  color: var(--purple); }
    .tag-green  { background: rgba(52,211,153,.14);  color: var(--green); }
    .tag-brown  { background: rgba(180,118,60,.14);  color: #b4763c; }
    .tag-orange { background: rgba(251,146,60,.14);  color: var(--orange); }
    .tag-red    { background: rgba(248,113,113,.14); color: var(--red); }
    .tag-teal   { background: rgba(45,212,191,.14);  color: #2dd4bf; }
    .tag-gray   { background: rgba(148,163,184,.14); color: #94a3b8; }

    .badge-in  { background: rgba(52,211,153,.14); color: var(--green); padding: 2px 9px; border-radius: 5px; font-size: 11px; font-weight: 600; }
    .badge-out { background: rgba(248,113,113,.14); color: var(--red);  padding: 2px 9px; border-radius: 5px; font-size: 11px; font-weight: 600; }

    /* ── In/Out Btns in Table ── */
    .btn-in {
      padding: 5px 11px; border-radius: 7px;
      background: rgba(52,211,153,.12);
      color: var(--green);
      border: 1px solid rgba(52,211,153,.28);
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .btn-in:hover { background: rgba(52,211,153,.22); }
    .btn-out {
      padding: 5px 11px; border-radius: 7px;
      background: rgba(248,113,113,.12);
      color: var(--red);
      border: 1px solid rgba(248,113,113,.28);
      font-size: 12px; font-weight: 600;
      cursor: pointer; transition: all .15s;
    }
    .btn-out:hover { background: rgba(248,113,113,.22); }

    /* ── Tabs ── */
    .tab-bar {
      display: flex; gap: 0;
      padding: 0 24px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    .tab-btn {
      padding: 14px 20px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: all .15s;
    }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); font-weight: 600; }
    .tab-panel { display: none; padding: 24px; }
    .tab-panel.active { display: block; }

    /* ── Stats Table ── */
    .stats-tbl { width: 100%; border-collapse: collapse; margin-bottom: 28px; }
    .stats-tbl th, .stats-tbl td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      text-align: right;
    }
    .stats-tbl th:first-child, .stats-tbl td:first-child { text-align: left; font-weight: 500; }
    .stats-tbl thead th { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; background: var(--surface2); }
    .stats-tbl tbody tr:last-child td { border-bottom: none; }

    /* ── Bar Chart ── */
    .bar-chart-wrap { overflow-x: auto; padding-bottom: 4px; }
    .bar-chart {
      display: flex; gap: 10px;
      align-items: flex-end;
      min-height: 170px;
      padding: 8px 4px 0;
    }
    .bar-group { display: flex; gap: 3px; align-items: flex-end; flex-shrink: 0; }
    .bar-col { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .bar { width: 26px; border-radius: 4px 4px 0 0; min-height: 2px; }
    .bar-in-color  { background: rgba(52,211,153,.55); }
    .bar-out-color { background: rgba(248,113,113,.55); }
    .bar-month { font-size: 10px; color: var(--text-muted); padding-top: 4px; }

    /* ── Grid ── */
    .row2 { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-top: 20px; }

    /* ── Summary Cards ── */
    .summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .sum-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .sum-card-label { font-size: 11px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
    .sum-card-val { font-family: 'Pretendard', sans-serif; font-size: 22px; font-weight: 500; }

    /* ── Modal / Overlay ── */
    .overlay {
      position: fixed; inset: 0; z-index: 500;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      display: none; align-items: center; justify-content: center;
      animation: fadeIn .18s ease;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      width: 480px;
      max-width: 95vw;
      max-height: 88vh;
      overflow-y: auto;
      animation: fadeUp .22s ease;
      position: relative;
    }
    .modal-lg { width: 720px; }
    .modal-sm { width: 380px; }
    @keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeUp  { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 22px; }
    .modal-close {
      position: absolute; top: 22px; right: 22px;
      width: 30px; height: 30px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; color: var(--text-muted);
      transition: all .15s;
    }
    .modal-close:hover { background: var(--surface3); color: var(--text); }

    /* ── Form ── */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px;
      margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%; padding: 10px 14px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text); font-size: 14px;
      outline: none; transition: border-color .2s;
    }
    .form-input:focus, .form-select:focus { border-color: var(--blue); }
    .form-input::placeholder { color: var(--text-dim); }

    /* ── Toggle ── */
    .type-toggle {
      display: flex; gap: 4px; padding: 4px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 11px;
    }
    .type-btn {
      flex: 1; padding: 8px; border-radius: 7px;
      border: none; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all .18s;
      color: var(--text-muted); background: none;
    }
    .type-btn.active-in  { background: rgba(52,211,153,.2);  color: var(--green); }
    .type-btn.active-out { background: rgba(248,113,113,.2); color: var(--red); }

    /* ── Qty Control ── */
    .qty-row { display: flex; align-items: center; gap: 8px; }
    .qty-btn {
      width: 36px; height: 36px; border-radius: 9px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all .15s; line-height: 1;
    }
    .qty-btn:hover { background: var(--surface3); }
    .qty-input-big {
      width: 80px; text-align: center;
      font-family: 'Pretendard', sans-serif;
      font-size: 20px; font-weight: 500;
    }
    .presets { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
    .preset-btn {
      padding: 4px 13px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--surface2);
      color: var(--text-muted); font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: 'Pretendard', sans-serif;
      transition: all .15s;
    }
    .preset-btn:hover { border-color: var(--blue); color: var(--blue); }

    /* ── Checkbox ── */
    .check-list { display: flex; flex-direction: column; gap: 11px; }
    .check-item { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
    .check-item input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--blue); cursor: pointer; }

    /* ── Quick Popup Stock Display ── */
    .stock-display {
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 11px; padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px;
    }
    .stock-display-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 3px; }
    .stock-display-val { font-family: 'Pretendard', sans-serif; font-size: 22px; font-weight: 500; }

    /* ── Detail Header ── */
    .detail-head {
      display: flex; align-items: flex-start;
      justify-content: space-between; gap: 12px;
      margin-bottom: 20px;
    }
    .detail-head-btns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    /* ── Cat/Product Manager Items ── */
    .mgr-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 13px; border-radius: 9px;
      border: 1px solid var(--border); margin-bottom: 7px;
      transition: background .12s;
    }
    .mgr-item:hover { background: var(--surface2); }
    .mgr-del {
      background: none; border: none; color: var(--text-muted);
      cursor: pointer; font-size: 14px; padding: 3px 7px;
      border-radius: 5px; transition: all .15s;
    }
    .mgr-del:hover { background: rgba(248,113,113,.15); color: var(--red); }

    /* ── Empty State ── */
    .empty {
      padding: 52px 24px; text-align: center;
      color: var(--text-muted);
    }
    .empty-icon { font-size: 44px; margin-bottom: 12px; }
    .empty-text { font-size: 14px; font-weight: 500; }
    .empty-sub  { font-size: 12px; margin-top: 6px; color: var(--text-dim); }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 16px 0; }

    /* ── Toast ── */
    .toast-wrap {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 9999; display: flex; flex-direction: column; align-items: center; gap: 7px;
    }
    .toast {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px; padding: 11px 20px;
      font-size: 13px; font-weight: 500;
      box-shadow: 0 8px 30px var(--shadow);
      animation: toastIn .25s ease;
      white-space: nowrap;
      color: var(--text);
    }
    .toast.ok  { border-color: rgba(52,211,153,.4); }
    .toast.err { border-color: rgba(248,113,113,.4); }
    @keyframes toastIn  { from { opacity:0; transform: translateY(10px); } to { opacity:1; transform: translateY(0); } }
    @keyframes toastOut { from { opacity:1; transform: translateY(0); }   to { opacity:0; transform: translateY(10px); } }

    .num { font-family: 'Pretendard', sans-serif; }

    /* ── Responsive ── */
    @media (max-width: 900px) {
      .row2 { grid-template-columns: 1fr; }
      .summary-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 600px) {
      .header { padding: 0 14px; }
      .main { padding: 78px 12px 32px; }
      .date-badge { display: none; }
    }
  </style>
</head>
<body>

<!-- ══════════════════════════════
     HEADER
══════════════════════════════ -->
<header class="header">
  <div class="header-left">
    <div class="nds-logo">NDS</div>
    <div class="header-title-wrap">
      <div class="header-title">NDS 재고 관리</div>
      <div class="header-subtitle">Inventory Management System</div>
    </div>
  </div>
  <div class="header-right">
    <span class="date-badge" id="dateBadge"></span>
    <button class="theme-btn" id="themeBtn" title="테마 전환">☀️</button>
    <span class="count-badge" id="countBadge">0개 상품</span>
    <button class="btn btn-secondary" onclick="openAddProduct()">+ 상품 추가</button>
    <button class="btn btn-primary" onclick="openAddTx()">↑↓ 입출고 등록</button>
  </div>
</header>

<!-- ══════════════════════════════
     MAIN
══════════════════════════════ -->
<main class="main">

  <!-- ① Inventory Panel -->
  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">📦 상품 재고 현황</span>
      <button class="btn btn-secondary" onclick="openExcelModal()">📥 엑셀 다운로드</button>
    </div>
    <div class="table-wrap">
      <table id="invTable">
        <thead>
          <tr>
            <th>
              상품명
              <button class="col-add" onclick="openProductMgr()" title="상품 추가/삭제">＋</button>
            </th>
            <th>
              카테고리
              <button class="col-add" onclick="openCatMgr()" title="카테고리 관리">＋</button>
            </th>
            <th>현재 재고</th>
            <th>입출고</th>
          </tr>
        </thead>
        <tbody id="invBody"></tbody>
      </table>
    </div>
  </div>

  <!-- ② Bottom Row -->
  <div class="row2">

    <!-- Stats Panel (tabbed) -->
    <div class="panel" style="overflow:visible;">
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-daily"   onclick="switchTab('daily')">날짜별 입출고 현황</button>
        <button class="tab-btn"        id="tab-monthly" onclick="switchTab('monthly')">월간 통계</button>
      </div>
      <div class="tab-panel active" id="panel-daily"   ><div id="dailyContent"></div></div>
      <div class="tab-panel"         id="panel-monthly"><div id="monthlyContent"></div></div>
    </div>

    <!-- Summary Panel -->
    <div class="panel" style="padding:24px;">
      <div class="panel-title" style="margin-bottom:16px;">📊 전체 요약</div>
      <div id="summaryContent"></div>
    </div>

  </div>
</main>

<!-- Toast -->
<div class="toast-wrap" id="toastWrap"></div>


<!-- ══════════════════════════════
     MODALS
══════════════════════════════ -->

<!-- ① 상품 추가 -->
<div class="overlay" id="ov-addProduct" onclick="ovClick(event,'ov-addProduct')">
  <div class="modal modal-sm" onclick="event.stopPropagation()">

<!-- ══════════════════════════════
     SCRIPT
══════════════════════════════ -->
<script>
/* ─── Storage Keys ─── */
const SK = {
  products:'nds_products',
  txns:'nds_txns',
  cats:'nds_cats',
  theme:'nds_theme'
};

/* ─── State ─── */
let products = [];
let txns = [];
let cats = [];
let theme = 'dark';
let txType = 'in';
let quickProductId = null;
let quickType = 'in';
let detailId = null;

/* ─── Init ─── */
function init() {
  load();
  renderDate();
  renderAll();
  bindEnterKeys();
}

function load() {
  try {
    products = JSON.parse(localStorage.getItem(SK.products) || '[]');
    txns     = JSON.parse(localStorage.getItem(SK.txns)     || '[]');
    cats     = JSON.parse(localStorage.getItem(SK.cats)     || '[]');
    theme    = localStorage.getItem(SK.theme) || 'dark';
  } catch(e) { products=[]; txns=[]; cats=[]; }
  if (!cats.length) cats = ['액세서리','주변기기','가구','기타'];
  applyTheme(false);
}

function save() {
  localStorage.setItem(SK.products, JSON.stringify(products));
  localStorage.setItem(SK.txns,     JSON.stringify(txns));
  localStorage.setItem(SK.cats,     JSON.stringify(cats));
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2);
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function bindEnterKeys() {
  document.getElementById('ap-name').addEventListener('keydown',   e => { if(e.key==='Enter') submitAddProduct(); });
  document.getElementById('tx-note').addEventListener('keydown',   e => { if(e.key==='Enter') submitTx(); });
  document.getElementById('quick-note').addEventListener('keydown',e => { if(e.key==='Enter') submitQuick(); });
}

/* ─── Render All ─── */
function renderAll() {
  renderInv();
  renderDaily();
  renderMonthly();
  renderSummary();
  document.getElementById('countBadge').textContent = products.length + '개 상품';
}

function renderDate() {
  const now = new Date();
  document.getElementById('dateBadge').textContent =
    now.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'short' });
}

/* ─── Stock Calc ─── */
function getStock(pid) {
  const p = products.find(x => x.id === pid);
  if (!p) return 0;
  return (p.initialStock || 0)
    + txns.filter(t => t.productId === pid && t.type === 'in').reduce((s,t) => s+t.qty, 0)
    - txns.filter(t => t.productId === pid && t.type === 'out').reduce((s,t) => s+t.qty, 0);
}
function getTotalIn(pid)  { return txns.filter(t => t.productId===pid && t.type==='in').reduce((s,t) => s+t.qty, 0); }
function getTotalOut(pid) { return txns.filter(t => t.productId===pid && t.type==='out').reduce((s,t) => s+t.qty, 0); }

/* ─── Category Tag ─── */
function catColorClass(name) {
  const palette = ['tag-blue','tag-purple','tag-green','tag-brown'];
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) | 0;
  return palette[Math.abs(h) % palette.length];
}
function catTag(c) {
  return `<span class="tag ${catColorClass(c)}">${escHtml(c)}</span>`;
}

/* ─── Inventory Table ─── */
function renderInv() {
  const tbody = document.getElementById('invBody');
  if (!products.length) {
    tbody.innerHTML = `<tr><td colspan="4">
      <div class="empty">
        <div class="empty-icon">📦</div>
        <div class="empty-text">등록된 상품이 없습니다</div>
        <div class="empty-sub">우측 상단의 [+ 상품 추가] 버튼을 눌러 시작하세요</div>
      </div></td></tr>`;
    return;
  }
  tbody.innerHTML = products.map(p => {
    const st = getStock(p.id);
    const numCls = st === 0 ? 'stock-zero' : st <= 5 ? 'stock-low' : '';
    return `<tr>
      <td><span class="product-link" onclick="openDetail('${p.id}')">${escHtml(p.name)}</span></td>
      <td>${catTag(p.category)}</td>
      <td>
        <div class="stock-num ${numCls}">${st.toLocaleString()}</div>
      </td>
      <td>
        <div style="display:flex;gap:6px;">
          <button class="btn-in"  onclick="openQuick('${p.id}','in')">▲ 입고</button>
          <button class="btn-out" onclick="openQuick('${p.id}','out')">▼ 출고</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

/* ─── Daily Stats ─── */
function renderDaily() {
  const el = document.getElementById('dailyContent');
  if (!txns.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">입출고 기록이 없습니다</div></div>`;
    return;
  }
  const grouped = {};
  txns.forEach(t => {
    if (!grouped[t.date]) grouped[t.date] = [];
    grouped[t.date].push(t);
  });
  const sorted = Object.keys(grouped).sort((a,b) => b.localeCompare(a));
  el.innerHTML = sorted.map(date => {
    const rows = grouped[date].map(t => {
      const pName = (products.find(p => p.id === t.productId) || {}).name || '(삭제된 상품)';
      const badge = t.type==='in' ? '<span class="badge-in">입고</span>' : '<span class="badge-out">출고</span>';
      const valCls = t.type==='in' ? 'color:var(--green)' : 'color:var(--red)';
      return `<tr>
        <td style="font-size:13px;">${escHtml(pName)}</td>
        <td>${badge}</td>
        <td class="num" style="${valCls};font-weight:500;">${t.type==='in'?'+':'-'}${t.qty.toLocaleString()}</td>
        <td style="font-size:12px;color:var(--text-muted);">${escHtml(t.note||'-')}</td>
      </tr>`;
    }).join('');
    return `<div style="margin-bottom:20px;">
      <div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:8px;">${fmtDate(date)}</div>
      <div style="border:1px solid var(--border);border-radius:10px;overflow:hidden;">
        <table><colgroup><col style="width:36%"><col style="width:14%"><col style="width:18%"><col></colgroup>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
  }).join('');
}

/* ─── Monthly Stats ─── */
function renderMonthly() {
  const el = document.getElementById('monthlyContent');
  if (!txns.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">📊</div><div class="empty-text">데이터가 없습니다</div></div>`;
    return;
  }
  const monthly = {};
  txns.forEach(t => {
    const m = t.date.slice(0,7);
    if (!monthly[m]) monthly[m] = { in:0, out:0, cnt:0 };
    if (t.type==='in') monthly[m].in += t.qty; else monthly[m].out += t.qty;
    monthly[m].cnt++;
  });
  const sortedDesc = Object.keys(monthly).sort((a,b) => b.localeCompare(a));
  const sortedAsc  = [...sortedDesc].reverse();

  const tableRows = sortedDesc.map(m => {
    const d = monthly[m];
    const net = d.in - d.out;
    const nc = net >= 0 ? 'color:var(--green)' : 'color:var(--red)';
    return `<tr>
      <td>${fmtMonth(m)}</td>
      <td class="num" style="color:var(--green);">+${d.in.toLocaleString()}</td>
      <td class="num" style="color:var(--red);">-${d.out.toLocaleString()}</td>
      <td class="num" style="${nc};font-weight:600;">${net>=0?'+':''}${net.toLocaleString()}</td>
      <td class="num" style="color:var(--text-muted);">${d.cnt}</td>
    </tr>`;
  }).join('');

  const maxV = Math.max(...Object.values(monthly).map(d => Math.max(d.in, d.out)), 1);
  const bars = sortedAsc.map(m => {
    const d = monthly[m];
    const ih = Math.round((d.in  / maxV) * 140);
    const oh = Math.round((d.out / maxV) * 140);
    const lb = m.slice(5).replace(/^0/,'');
    return `<div class="bar-group">
      <div class="bar-col">
        <div class="bar bar-in-color"  style="height:${ih}px;" title="입고 ${d.in.toLocaleString()}"></div>
      </div>
      <div class="bar-col">
        <div class="bar bar-out-color" style="height:${oh}px;" title="출고 ${d.out.toLocaleString()}"></div>
        <div class="bar-month">${lb}월</div>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    <table class="stats-tbl">
      <thead><tr><th>월</th><th>총 입고</th><th>총 출고</th><th>순증감</th><th>처리건수</th></tr></thead>
      <tbody>${tableRows}</tbody>
    </table>
    <div style="margin-bottom:8px;">
      <span style="font-size:12px;color:var(--text-muted);">
        <span style="display:inline-block;width:10px;height:10px;background:rgba(52,211,153,.55);border-radius:2px;margin-right:5px;"></span>입고
        <span style="display:inline-block;width:10px;height:10px;background:rgba(248,113,113,.55);border-radius:2px;margin:0 5px 0 14px;"></span>출고
      </span>
    </div>
    <div class="bar-chart-wrap"><div class="bar-chart">${bars}</div></div>
  `;
}

/* ─── Summary Panel ─── */
function renderSummary() {
  const el = document.getElementById('summaryContent');
  const totalProd  = products.length;
  const totalStock = products.reduce((s,p) => s + getStock(p.id), 0);
  const totalIn    = txns.filter(t=>t.type==='in').reduce((s,t)=>s+t.qty,0);
  const totalOut   = txns.filter(t=>t.type==='out').reduce((s,t)=>s+t.qty,0);
  const zeroCount  = products.filter(p => getStock(p.id) === 0).length;

  el.innerHTML = `
    <div class="summary-grid">
      <div class="sum-card">
        <div class="sum-card-label">총 상품 수</div>
        <div class="sum-card-val">${totalProd}</div>
      </div>
      <div class="sum-card">
        <div class="sum-card-label">총 재고</div>
        <div class="sum-card-val">${totalStock.toLocaleString()}</div>
      </div>
      <div class="sum-card">
        <div class="sum-card-label">누적 입고</div>
        <div class="sum-card-val" style="color:var(--green);">${totalIn.toLocaleString()}</div>
      </div>
      <div class="sum-card">
        <div class="sum-card-label">누적 출고</div>
        <div class="sum-card-val" style="color:var(--red);">${totalOut.toLocaleString()}</div>
      </div>
    </div>
    ${zeroCount > 0
      ? `<div style="padding:10px 14px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);border-radius:9px;font-size:13px;color:var(--red);">⚠️ 재고 없음: ${zeroCount}개 상품</div>`
      : `<div style="padding:10px 14px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2);border-radius:9px;font-size:13px;color:var(--green);">✓ 모든 상품 재고 정상</div>`
    }
  `;
}

/* ─── Tabs ─── */
function switchTab(tab) {
  ['daily','monthly'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
  });
}

/* ─── Modal Helpers ─── */
function openOv(id) { document.getElementById(id).classList.add('open'); }
function closeOv(id){ document.getElementById(id).classList.remove('open'); }
function ovClick(e, id) { if (e.target === document.getElementById(id)) closeOv(id); }

/* ─── Add Product ─── */
function openAddProduct() {
  document.getElementById('ap-name').value = '';
  document.getElementById('ap-stock').value = '0';
  const sel = document.getElementById('ap-cat');
  sel.innerHTML = cats.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
  openOv('ov-addProduct');
  setTimeout(() => document.getElementById('ap-name').focus(), 120);
}

function submitAddProduct() {
  const name  = document.getElementById('ap-name').value.trim();
  const cat   = document.getElementById('ap-cat').value;
  const stock = Math.max(0, parseInt(document.getElementById('ap-stock').value) || 0);
  if (!name) { toast('상품명을 입력하세요.','err'); return; }
  if (products.find(p => p.name === name)) { toast('이미 존재하는 상품명입니다.','err'); return; }
  products.push({ id: uid(), name, category: cat, initialStock: stock });
  save();
  closeOv('ov-addProduct');
  renderAll();
  toast(`"${name}" 상품이 추가되었습니다.`,'ok');
}

/* ─── Add Transaction ─── */
function openAddTx() {
  if (!products.length) { toast('먼저 상품을 추가해주세요.','err'); return; }
  const sel = document.getElementById('tx-product');
  sel.innerHTML = products.map(p => `<option value="${p.id}">${escHtml(p.name)}</option>`).join('');
  document.getElementById('tx-qty').value  = '1';
  document.getElementById('tx-date').value = today();
  document.getElementById('tx-note').value = '';
  setTxType('in');
  openOv('ov-addTx');
}

function setTxType(t) {
  txType = t;
  document.getElementById('tx-in').className  = 'type-btn' + (t==='in'  ? ' active-in'  : '');
  document.getElementById('tx-out').className = 'type-btn' + (t==='out' ? ' active-out' : '');
}

function submitTx() {
  const pid  = document.getElementById('tx-product').value;
  const qty  = parseInt(document.getElementById('tx-qty').value) || 0;
  const date = document.getElementById('tx-date').value;
  const note = document.getElementById('tx-note').value.trim();
  if (!pid)   { toast('상품을 선택하세요.','err'); return; }
  if (qty < 1){ toast('수량은 1 이상이어야 합니다.','err'); return; }
  if (!date)  { toast('날짜를 입력하세요.','err'); return; }
  txns.push({ id:uid(), productId:pid, type:txType, qty, date, note });
  save();
  closeOv('ov-addTx');
  renderAll();
  const p = products.find(x => x.id === pid);
  toast(`${escHtml(p.name)} ${txType==='in'?'입고':'출고'} ${qty.toLocaleString()}개 등록 완료!`,'ok');
}

/* ─── Quick Popup ─── */
function openQuick(pid, type) {
  quickProductId = pid;
  quickType = type;
  const p  = products.find(x => x.id === pid);
  const st = getStock(pid);
  const isIn = type === 'in';
  document.getElementById('quick-title').textContent       = isIn ? '▲ 입고' : '▼ 출고';
  document.getElementById('quick-product-name').textContent = p.name;
  document.getElementById('quick-stock').textContent        = st.toLocaleString();
  document.getElementById('quick-qty').value  = '1';
  document.getElementById('quick-date').value = today();
  document.getElementById('quick-note').value = '';
  const btn = document.getElementById('quick-submit-btn');
  btn.textContent = isIn ? '▲ 입고 등록' : '▼ 출고 등록';
  btn.style.cssText = isIn
    ? 'width:100%;padding:12px;font-size:14px;margin-top:4px;border-radius:11px;background:rgba(52,211,153,.18);color:var(--green);border:1px solid rgba(52,211,153,.35);font-weight:600;cursor:pointer;'
    : 'width:100%;padding:12px;font-size:14px;margin-top:4px;border-radius:11px;background:rgba(248,113,113,.18);color:var(--red);border:1px solid rgba(248,113,113,.35);font-weight:600;cursor:pointer;';
  openOv('ov-quick');
}

function submitQuick() {
  const qty  = parseInt(document.getElementById('quick-qty').value) || 0;
  const date = document.getElementById('quick-date').value;
  const note = document.getElementById('quick-note').value.trim();
  if (qty < 1)  { toast('수량은 1 이상이어야 합니다.','err'); return; }
  if (!date)    { toast('날짜를 입력하세요.','err'); return; }
  txns.push({ id:uid(), productId:quickProductId, type:quickType, qty, date, note });
  save();
  closeOv('ov-quick');
  renderAll();
  const p = products.find(x => x.id === quickProductId);
  toast(`${escHtml(p.name)} ${quickType==='in'?'입고':'출고'} ${qty.toLocaleString()}개 등록 완료!`,'ok');
}

/* ─── Product Detail ─── */
function openDetail(pid) {
  detailId = pid;
  const p  = products.find(x => x.id === pid);
  if (!p) return;
  const pTxns = txns.filter(t => t.productId === pid);
  const st    = getStock(pid);
  const tin   = getTotalIn(pid);
  const tout  = getTotalOut(pid);

  document.getElementById('det-name').textContent = p.name;
  document.getElementById('det-meta').textContent = `${p.category} · 총 ${pTxns.length}건`;

  document.getElementById('det-cards').innerHTML = `
    <div class="sum-card">
      <div class="sum-card-label">현재 재고</div>
      <div class="sum-card-val">${st.toLocaleString()}</div>
    </div>
    <div class="sum-card">
      <div class="sum-card-label">누적 입고</div>
      <div class="sum-card-val" style="color:var(--green);">${tin.toLocaleString()}</div>
    </div>
    <div class="sum-card">
      <div class="sum-card-label">누적 출고</div>
      <div class="sum-card-val" style="color:var(--red);">${tout.toLocaleString()}</div>
    </div>
  `;

  const sorted = [...pTxns].sort((a,b) => b.date.localeCompare(a.date));
  document.getElementById('det-body').innerHTML = sorted.length
    ? sorted.map(t => {
        const badge = t.type==='in'
          ? '<span class="badge-in">입고</span>'
          : '<span class="badge-out">출고</span>';
        const vc = t.type==='in' ? 'color:var(--green)' : 'color:var(--red)';
        return `<tr>
          <td class="num" style="font-size:13px;">${t.date}</td>
          <td>${badge}</td>
          <td class="num" style="${vc};font-weight:500;">${t.type==='in'?'+':'-'}${t.qty.toLocaleString()}</td>
          <td style="font-size:13px;color:var(--text-muted);">${escHtml(t.note||'-')}</td>
        </tr>`;
      }).join('')
    : `<tr><td colspan="4"><div class="empty"><div class="empty-text">입출고 기록이 없습니다</div></div></td></tr>`;

  openOv('ov-detail');
}

/* ─── Delete from Detail ─── */
function deleteFromDetail() {
  if (!detailId) return;
  const p = products.find(x => x.id === detailId);
  if (!p) return;
  if (!confirm(`"${p.name}" 상품을 삭제하시겠습니까?\n관련 입출고 기록도 함께 삭제됩니다.`)) return;
  products = products.filter(x => x.id !== detailId);
  txns     = txns.filter(t => t.productId !== detailId);
  save();
  closeOv('ov-detail');
  renderAll();
  toast(`"${escHtml(p.name)}" 상품 삭제됨`,'ok');
}

/* ─── Category Manager ─── */
function openCatMgr() {
  document.getElementById('cat-new').value = '';
  renderCatList();
  openOv('ov-catMgr');
  setTimeout(() => document.getElementById('cat-new').focus(), 120);
}

function renderCatList() {
  const el = document.getElementById('catList');
  if (!cats.length) {
    el.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:13px;padding:14px;">카테고리가 없습니다</p>';
    return;
  }
  el.innerHTML = cats.map(c => `
    <div class="mgr-item">
      ${catTag(c)}
      <button class="mgr-del" onclick="deleteCat('${escAttr(c)}')">✕</button>
    </div>
  `).join('');
}

function addCat() {
  const name = document.getElementById('cat-new').value.trim();
  if (!name) { toast('카테고리 이름을 입력하세요.','err'); return; }
  if (cats.includes(name)) { toast('이미 존재하는 카테고리입니다.','err'); return; }
  cats.push(name);
  save();
  renderCatList();
  document.getElementById('cat-new').value = '';
  toast(`"${name}" 카테고리가 추가되었습니다.`,'ok');
}

function deleteCat(name) {
  if (products.find(p => p.category === name)) {
    toast('사용 중인 카테고리는 삭제할 수 없습니다.','err');
    return;
  }
  cats = cats.filter(c => c !== name);
  save();
  renderCatList();
  toast(`"${name}" 카테고리 삭제됨`,'ok');
}

/* ─── Product Manager ─── */
function openProductMgr() {
  document.getElementById('pmgr-name').value  = '';
  document.getElementById('pmgr-stock').value = '0';
  const sel = document.getElementById('pmgr-cat');
  sel.innerHTML = cats.map(c => `<option value="${escHtml(c)}">${escHtml(c)}</option>`).join('');
  renderProductMgrList();
  openOv('ov-productMgr');
  setTimeout(() => document.getElementById('pmgr-name').focus(), 120);
}

function submitAddFromMgr() {
  const name  = document.getElementById('pmgr-name').value.trim();
  const cat   = document.getElementById('pmgr-cat').value;
  const stock = Math.max(0, parseInt(document.getElementById('pmgr-stock').value) || 0);
  if (!name) { toast('상품명을 입력하세요.','err'); return; }
  if (products.find(p => p.name === name)) { toast('이미 존재하는 상품명입니다.','err'); return; }
  products.push({ id: uid(), name, category: cat, initialStock: stock });
  save();
  document.getElementById('pmgr-name').value  = '';
  document.getElementById('pmgr-stock').value = '0';
  renderProductMgrList();
  renderAll();
  toast(`"${name}" 상품이 추가되었습니다.`,'ok');
}

function renderProductMgrList() {
  const el = document.getElementById('productMgrList');
  if (!products.length) {
    el.innerHTML = '<p style="text-align:center;color:var(--text-muted);font-size:13px;padding:14px;">등록된 상품이 없습니다</p>';
    return;
  }
  el.innerHTML = products.map(p => {
    const st = getStock(p.id);
    return `<div class="mgr-item">
      <div>
        <div style="font-weight:500;">${escHtml(p.name)}</div>
        <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${escHtml(p.category)} · 재고 ${st.toLocaleString()}</div>
      </div>
      <button class="mgr-del" onclick="deleteProduct('${p.id}')">✕</button>
    </div>`;
  }).join('');
}

function deleteProduct(id) {
  const p = products.find(x => x.id === id);
  if (!p) return;
  if (!confirm(`"${p.name}" 상품을 삭제하시겠습니까?\n관련 입출고 기록도 함께 삭제됩니다.`)) return;
  products = products.filter(x => x.id !== id);
  txns     = txns.filter(t => t.productId !== id);
  save();
  renderProductMgrList();
  renderAll();
  toast(`"${escHtml(p.name)}" 상품 삭제됨`,'ok');
}

/* ─── Excel Download (All Products) ─── */
function openExcelModal() { openOv('ov-excel'); }

function doExcel() {
  const inc = {
    name:  document.getElementById('xl-name').checked,
    cat:   document.getElementById('xl-cat').checked,
    stock: document.getElementById('xl-stock').checked,
    tin:   document.getElementById('xl-in').checked,
    tout:  document.getElementById('xl-out').checked,
  };
  if (!Object.values(inc).some(Boolean)) { toast('최소 하나 이상의 항목을 선택하세요.','err'); return; }
  const header = [];
  if (inc.name)  header.push('상품명');
  if (inc.cat)   header.push('카테고리');
  if (inc.stock) header.push('현재 재고');
  if (inc.tin)   header.push('누적 입고 수량');
  if (inc.tout)  header.push('누적 출고 수량');
  const rows = products.map(p => {
    const r = [];
    if (inc.name)  r.push(p.name);
    if (inc.cat)   r.push(p.category);
    if (inc.stock) r.push(getStock(p.id));
    if (inc.tin)   r.push(getTotalIn(p.id));
    if (inc.tout)  r.push(getTotalOut(p.id));
    return r;
  });
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '재고현황');
  XLSX.writeFile(wb, 'NDS_재고현황.xlsx');
  closeOv('ov-excel');
  toast('엑셀 파일이 다운로드되었습니다.','ok');
}

/* ─── Excel Download (Product Detail) ─── */
function doProductExcel() {
  if (!detailId) return;
  const p = products.find(x => x.id === detailId);
  if (!p) return;
  const pTxns = txns.filter(t => t.productId === detailId).sort((a,b) => b.date.localeCompare(a.date));
  const header = ['날짜','구분','수량','내용'];
  const rows = pTxns.map(t => [t.date, t.type==='in'?'입고':'출고', t.qty, t.note||'']);
  const ws = XLSX.utils.aoa_to_sheet([header, ...rows]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '입출고내역');
  XLSX.writeFile(wb, `NDS_${p.name}_입출고내역.xlsx`);
  toast('엑셀 파일이 다운로드되었습니다.','ok');
}

/* ─── Qty Helpers ─── */
function adjQty(id, delta) {
  const el = document.getElementById(id);
  el.value = Math.max(1, (parseInt(el.value) || 0) + delta);
}
function setQtyVal(id, v) { document.getElementById(id).value = v; }

/* ─── Theme ─── */
function applyTheme(save_) {
  document.documentElement.setAttribute('data-theme', theme);
  document.getElementById('themeBtn').textContent = theme === 'dark' ? '☀️' : '🌙';
  if (save_) localStorage.setItem(SK.theme, theme);
}

document.getElementById('themeBtn').addEventListener('click', () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  applyTheme(true);
});

/* ─── Toast ─── */
function toast(msg, type='ok') {
  const wrap = document.getElementById('toastWrap');
  const el   = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => {
    el.style.animation = 'toastOut .25s ease forwards';
    setTimeout(() => el.remove(), 260);
  }, 3000);
}

/* ─── Escape Helpers ─── */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g,"\\'");
}

/* ─── Format ─── */
function fmtDate(str) {
  const d = new Date(str + 'T00:00:00');
  return d.toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric', weekday:'long' });
}
function fmtMonth(str) {
  const [y,m] = str.split('-');
  return `${y}년 ${parseInt(m)}월`;
}

/* ─── Start ─── */
init();
